# Rede
bind 0.0.0.0
port $REDIS_PORT
protected-mode yes

# Autenticação
requirepass mendes123

# Utilizador com permissões totais
user $REDIS_USER on >$REDIS_PASSWORD ~* &* +@all
user default off

# Persistência
appendonly yes
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000

#modulos
loadmodule /opt/redis-stack/lib/redisearch.so
loadmodule /opt/redis-stack/lib/rejson.so

# Logs
loglevel notice