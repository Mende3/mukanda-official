volumes:
  postgres_data:
    name: postgres_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mukanda_saas/postgres

  redis_data:
    name: redis_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mukanda_saas/redis

  n8n_data:
    name: n8n_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mukanda_saas/n8n

  evogo_data:
    name: evogo_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mukanda_saas/evogo
  
  rabbitmq_lib_data:
    name: rabbitmq_lib_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mukanda_saas/rabbitmq/rabbitmq_lib

  rabbitmq_log_data:
    name: rabbitmq_log_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mukanda_saas/rabbitmq/rabbitmq_log


networks:
   mukanda-network:
    driver: bridge